name: Build and publish APK

on:
  push:
    branches: ['**']
    tags: ['**', '!development']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: github.ref_type == 'tag' && github.ref_name != 'development' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: apk-${{ github.ref_type }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleRelease

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools_dir="$ANDROID_HOME/build-tools/35.0.0"
          keystore="$(mktemp)"
          aligned="$(mktemp)"
          trap 'rm -f "$keystore" "$aligned"' EXIT
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            echo 'Using a temporary debug signing key.'
            rm "$keystore"
            export STORE_PASSWORD=android KEY_PASSWORD=android KEY_ALIAS=androiddebugkey
            keytool -genkeypair -keystore "$keystore" -storetype JKS \
              -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          "$tools_dir/zipalign" -f -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk "$aligned"
          "$tools_dir/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out SVGviewer.apk "$aligned"
          "$tools_dir/apksigner" verify SVGviewer.apk

      - name: Publish development build
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          current="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$BRANCH" -F per_page=1 --jq '.[0].sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on the default branch. Skipping publication.'
            exit 0
          fi

          if gh release view development --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/development" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload development SVGviewer.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit development --title 'development build' --prerelease --latest=false \
              --notes "Development APK built from commit $GITHUB_SHA." --repo "$GITHUB_REPOSITORY"
          else
            gh release create development SVGviewer.apk --target "$GITHUB_SHA" \
              --title 'development build' --prerelease --latest=false \
              --notes "Development APK built from commit $GITHUB_SHA." --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" -- "$TAG" >/dev/null 2>&1; then
            gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$TAG" SVGviewer.apk
          else
            gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes -- "$TAG" SVGviewer.apk
          fi
