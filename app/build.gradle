plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.example.svgviewer'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.example.svgviewer'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}
